apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bugtracker.frontendName" . }}-runtime
  labels:
    {{- include "bugtracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  runtime-config.js: |
    window.__BUGTRACKER_API_URL__ = {{ .Values.frontend.publicApiUrl | quote }};
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bugtracker.frontendName" . }}
  labels:
    {{- include "bugtracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/runtime: {{ .Values.frontend.publicApiUrl | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: {{ printf "%s/%s:%s" .Values.frontend.image.registry .Values.frontend.image.repository .Values.frontend.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /app/public/runtime-config.js
              subPath: runtime-config.js
      volumes:
        - name: runtime
          configMap:
            name: {{ include "bugtracker.frontendName" . }}-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bugtracker.frontendName" . }}
  labels:
    {{- include "bugtracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
