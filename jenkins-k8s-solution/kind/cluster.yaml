kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jenkins
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 9000
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Bug Tracker stable
      - containerPort: 30081
        hostPort: 18080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30030
        hostPort: 13000
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Bug Tracker canary
      - containerPort: 30082
        hostPort: 18081
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30031
        hostPort: 13001
        listenAddress: "127.0.0.1"
        protocol: TCP
